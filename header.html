<!-- EduHostel Responsive Header: paste this header into each page before <main> or page content.
     This version uses regular CSS/JavaScript and does not require Tailwind for the header. -->

<style>
  :root {
    --eh-bg: rgba(255,255,255,.94);
    --eh-text: #2a2238;
    --eh-primary: #403d88;
    --eh-purple: #8b639b;
    --eh-pink: #ff9ebb;
    --eh-border: #f3b6c2;
    --eh-menu: #fdf2f4;
    --eh-shadow: 0 8px 28px rgba(64,61,136,.12);
  }

  html.dark {
    --eh-bg: rgba(8,6,17,.95);
    --eh-text: #dfd7ea;
    --eh-border: #3b325c;
    --eh-menu: #100c20;
    color-scheme: dark;
  }

  .eh-header, .eh-header * { box-sizing: border-box; }
  .eh-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
    color: var(--eh-text);
    background: var(--eh-bg);
    border-bottom: 1px solid color-mix(in srgb, var(--eh-border) 70%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 3px 16px rgba(40,25,60,.04);
    font-family: Arial, Helvetica, sans-serif;
  }

  .eh-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 3px;
    background: linear-gradient(90deg, #403d88, #8b639b, #af719d, #ff9ebb);
  }

  .eh-header-inner {
    max-width: 1320px;
    min-height: 72px;
    margin: 0 auto;
    padding: 10px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .eh-brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--eh-primary);
    text-decoration: none;
    font-size: 22px;
    font-weight: 800;
    white-space: nowrap;
  }
  html.dark .eh-brand { color: var(--eh-pink); }
  .eh-brand-icon { font-size: 27px; transition: transform .3s ease; }
  .eh-brand:hover .eh-brand-icon { transform: rotate(-12deg) scale(1.1); }

  .eh-desktop-nav { flex: 1; display: flex; justify-content: center; min-width: 0; }
  .eh-nav-list {
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    margin: 0;
    padding: 5px;
    border: 1px solid var(--eh-border);
    border-radius: 999px;
    background: rgba(252,229,233,.35);
  }
  html.dark .eh-nav-list { background: rgba(28,22,53,.65); }

  .eh-nav-link {
    display: inline-block;
    padding: 10px 11px;
    border-radius: 999px;
    color: var(--eh-text);
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .35px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .eh-nav-link:hover { color: var(--eh-purple); transform: translateY(-1px); }
  .eh-nav-link.active {
    background: #fff;
    color: var(--eh-primary);
    box-shadow: 0 3px 10px rgba(139,99,155,.18);
  }
  html.dark .eh-nav-link.active { background: #2b1f47; color: var(--eh-pink); }

  .eh-actions { display: flex; align-items: center; gap: 8px; }
  .eh-login {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 38px;
    padding: 9px 12px;
    border: 1px solid var(--eh-purple);
    border-radius: 11px;
    color: var(--eh-primary);
    background: transparent;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
    transition: transform .2s ease, background .2s ease, color .2s ease;
  }
  html.dark .eh-login { color: var(--eh-pink); border-color: var(--eh-pink); }
  .eh-login:hover { transform: translateY(-1px); background: var(--eh-purple); color: #fff; }
  .eh-login-admin {
    border-color: transparent;
    background: linear-gradient(110deg, #403d88, #8b639b, #af719d);
    color: #fff;
  }
  .eh-login-admin:hover { color: #fff; filter: brightness(1.08); }

  .eh-theme-toggle {
    width: 60px;
    height: 32px;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7px;
    border: 1.5px solid var(--eh-border);
    border-radius: 999px;
    background: #fce5e9;
    cursor: pointer;
    flex-shrink: 0;
  }
  html.dark .eh-theme-toggle { background: #1c1635; border-color: #4b3d75; }
  .eh-theme-toggle .eh-sun, .eh-theme-toggle .eh-moon { font-size: 14px; position: relative; z-index: 1; }
  .eh-toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 2px 6px rgba(64,61,136,.25);
    transition: transform .25s ease, background .25s ease;
  }
  html.dark .eh-toggle-thumb { transform: translateX(28px); background: var(--eh-pink); }

  .eh-menu-button {
    display: none;
    align-items: center;
    justify-content: center;
    width: 43px;
    height: 43px;
    border: 1px solid var(--eh-border);
    border-radius: 12px;
    color: var(--eh-primary);
    background: #fce5e9;
    font-size: 25px;
    cursor: pointer;
  }
  html.dark .eh-menu-button { color: var(--eh-pink); background: #1c1635; }

  .eh-mobile-menu {
    display: none;
    padding: 0 18px 18px;
    background: var(--eh-menu);
    border-top: 1px solid var(--eh-border);
    box-shadow: var(--eh-shadow);
  }
  .eh-mobile-menu.is-open { display: block; }
  .eh-mobile-nav-link {
    display: block;
    padding: 12px 13px;
    margin-top: 5px;
    border-radius: 10px;
    color: var(--eh-text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
  }
  .eh-mobile-nav-link:hover, .eh-mobile-nav-link.active { background: rgba(243,182,194,.35); color: var(--eh-purple); }
  html.dark .eh-mobile-nav-link:hover, html.dark .eh-mobile-nav-link.active { background: #1c1635; color: var(--eh-pink); }
  .eh-mobile-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 13px;
    padding-top: 13px;
    border-top: 1px solid var(--eh-border);
  }
  .eh-mobile-actions .eh-login { width: 100%; min-height: 42px; font-size: 12px; }
  .eh-mobile-theme-row {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid var(--eh-border);
    border-radius: 11px;
    font-size: 12px;
    font-weight: 800;
  }

  @media (max-width: 1100px) {
    .eh-header-inner { gap: 10px; padding-left: 15px; padding-right: 15px; }
    .eh-nav-link { padding: 9px 7px; font-size: 10px; }
    .eh-actions { gap: 6px; }
    .eh-login { padding: 8px 9px; }
  }
  @media (max-width: 900px) {
    .eh-header-inner { min-height: 66px; }
    .eh-desktop-nav, .eh-actions { display: none; }
    .eh-menu-button { display: inline-flex; }
    .eh-brand { font-size: 21px; }
  }
</style>

<header class="eh-header" id="eduHostelHeader">
  <div class="eh-progress" id="ehScrollProgress"></div>

  <div class="eh-header-inner">
    <a class="eh-brand" href="index.html" aria-label="EduHostel home">
      <span class="eh-brand-icon">🎓</span>
      <span>EduHostel</span>
    </a>

    <nav class="eh-desktop-nav" aria-label="Main navigation">
      <ul class="eh-nav-list">
        <li><a class="eh-nav-link" href="index.html">Home</a></li>
        <li><a class="eh-nav-link" href="about.html">About</a></li>
        <li><a class="eh-nav-link" href="courses.html">Courses</a></li>
        <li><a class="eh-nav-link" href="hostel.html">Hostel</a></li>
        <li><a class="eh-nav-link" href="admission.html">Admission</a></li>
        <li><a class="eh-nav-link" href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <div class="eh-actions">
      <button class="eh-theme-toggle" type="button" data-theme-toggle aria-label="Toggle light and dark mode" title="Toggle theme">
        <span class="eh-sun">☀</span><span class="eh-moon">☾</span><span class="eh-toggle-thumb"></span>
      </button>
      <a class="eh-login" href="studentlogin.html">Student Login</a>
      <a class="eh-login eh-login-admin" href="admin.html">Admin Login</a>
    </div>

    <button class="eh-menu-button" id="ehMenuButton" type="button"
            aria-label="Open navigation menu" aria-controls="ehMobileMenu" aria-expanded="false">☰</button>
  </div>

  <div class="eh-mobile-menu" id="ehMobileMenu">
    <nav aria-label="Mobile navigation">
      <a class="eh-mobile-nav-link" href="index.html">Home</a>
      <a class="eh-mobile-nav-link" href="about.html">About</a>
      <a class="eh-mobile-nav-link" href="courses.html">Courses</a>
      <a class="eh-mobile-nav-link" href="hostel.html">Hostel</a>
      <a class="eh-mobile-nav-link" href="admission.html">Admission</a>
      <a class="eh-mobile-nav-link" href="contact.html">Contact</a>
        <a class="eh-mobile-nav-link" href="contact.html">Contact</a>
    </nav>
    <div class="eh-mobile-actions">
      <a class="eh-login" href="studentlogin.html">Student Login</a>
      <a class="eh-login eh-login-admin" href="admin.html">Admin Login</a>
      <div class="eh-mobile-theme-row">
        <span>Appearance</span>
        <button class="eh-theme-toggle" type="button" data-theme-toggle aria-label="Toggle light and dark mode" title="Toggle theme">
          <span class="eh-sun">☀</span><span class="eh-moon">☾</span><span class="eh-toggle-thumb"></span>
        </button>
      </div>
    </div>
  </div>
</header>

<script>
(function () {
  const root = document.documentElement;
  const menuButton = document.getElementById('ehMenuButton');
  const mobileMenu = document.getElementById('ehMobileMenu');
  const progress = document.getElementById('ehScrollProgress');

  // Restore the user's saved theme, if any.
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
  if (savedTheme === 'dark') root.classList.add('dark');
  else if (savedTheme === 'light') root.classList.remove('dark');

  // Both desktop and mobile theme buttons use the same handler.
  document.querySelectorAll('[data-theme-toggle]').forEach(function (button) {
    button.addEventListener('click', function () {
      const darkNow = root.classList.toggle('dark');
      try { localStorage.setItem('theme', darkNow ? 'dark' : 'light'); } catch (e) {}
    });
  });

  // Mobile menu opens/closes on phone and closes after choosing a page.
  if (menuButton && mobileMenu) {
    menuButton.addEventListener('click', function () {
      const open = mobileMenu.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(open));
      menuButton.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
      menuButton.textContent = open ? '✕' : '☰';
    });

    mobileMenu.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        mobileMenu.classList.remove('is-open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.setAttribute('aria-label', 'Open navigation menu');
        menuButton.textContent = '☰';
      });
    });
  }

  // Highlight the current page in desktop and mobile navigation.
  const currentFile = (window.location.pathname.split('/').pop() || 'index.html').toLowerCase();
  document.querySelectorAll('.eh-nav-link, .eh-mobile-nav-link').forEach(function (link) {
    const target = (link.getAttribute('href') || '').toLowerCase();
    if (target === currentFile || (currentFile === '' && target === 'index.html')) {
      link.classList.add('active');
      link.setAttribute('aria-current', 'page');
    }
  });

  // Scroll progress indicator.
  function updateProgress() {
    if (!progress) return;
    const doc = document.documentElement;
    const scrollable = doc.scrollHeight - doc.clientHeight;
    progress.style.width = (scrollable > 0 ? (doc.scrollTop / scrollable) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress);
  updateProgress();
})();
</script>
