<!-- HEADER STYLES & ANIMATIONS -->
<style>
  /* 1. Header Top Glass & Scroll Progress Bar */
  .header-glass {
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  #scrollProgressBar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2.5px;
    width: 0%;
    background: linear-gradient(90deg, #403D88, #8B639B, #AF719D, #ff9ebb);
    box-shadow: 0 0 10px rgba(255, 158, 187, 0.6);
    transition: width 0.1s linear;
    z-index: 60;
  }

  /* 2. Nav Pill Track & Active Highlight */
  .nav-pill-track {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(252, 229, 233, 0.45);
    border: 1px solid rgba(243, 182, 194, 0.55);
    border-radius: 9999px;
    padding: 3px 5px;
  }
  .dark .nav-pill-track {
    background: rgba(28, 22, 53, 0.6);
    border-color: rgba(59, 50, 92, 0.7);
  }

  .nav-link-item {
    position: relative;
    z-index: 2;
    padding: 6px 14px;
    border-radius: 9999px;
    transition: all 0.25s ease;
  }
  .nav-link-item:hover {
    color: #8B639B;
    transform: translateY(-1px);
  }
  .dark .nav-link-item:hover {
    color: #ff9ebb;
  }

  /* Active Page Highlight Pill */
  .nav-link-item.active {
    background: #ffffff;
    color: #403D88 !important;
    font-weight: 800;
    box-shadow: 0 3px 10px rgba(139, 99, 155, 0.18);
  }
  .dark .nav-link-item.active {
    background: linear-gradient(135deg, #2b1f47, #1c1635);
    color: #ff9ebb !important;
    border: 1px solid rgba(255, 158, 187, 0.35);
    box-shadow: 0 0 12px rgba(255, 158, 187, 0.25);
  }

  /* 3. Logo 3D Micro-Wobble */
  .logo-cap {
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
  }
  .logo-wrap:hover .logo-cap {
    transform: rotate(-14deg) scale(1.22);
    filter: drop-shadow(0 0 8px rgba(255, 158, 187, 0.8));
  }

  /* 4. Sleek Dual-Icon Theme Toggle */
  .theme-toggle-switch {
    width: 62px;
    height: 32px;
    background: #fce5e9;
    border: 1.5px solid #f3b6c2;
    border-radius: 9999px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .dark .theme-toggle-switch {
    background: #1c1635;
    border-color: #4b3d75;
    box-shadow: 0 0 12px rgba(255, 158, 187, 0.15);
  }
  .toggle-thumb {
    position: absolute;
    left: 4px;
    top: 3px;
    width: 24px;
    height: 24px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(64, 61, 136, 0.25);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease;
    z-index: 2;
  }
  .dark .toggle-thumb {
    transform: translateX(30px);
    background: #ff9ebb;
    box-shadow: 0 0 10px rgba(255, 158, 187, 0.6);
  }
  .toggle-icon {
    width: 14px;
    height: 14px;
    z-index: 1;
    transition: opacity 0.25s ease, color 0.25s ease;
  }
  .sun-icon {
    color: #c2547b;
    opacity: 1;
  }
  .dark .sun-icon {
    color: #8b7d99;
    opacity: 0.45;
  }
  .moon-icon {
    color: #8b7d99;
    opacity: 0.45;
  }
  .dark .moon-icon {
    color: #080611;
    opacity: 1;
  }

  /* 5. Liquid Light Shimmer on Buttons */
  .liquid-btn {
    position: relative;
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
  }
  .liquid-btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -100%;
    width: 60%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: rotate(25deg);
    transition: left 0.75s ease;
  }
  .liquid-btn:hover::after {
    left: 140%;
  }
  .liquid-btn:hover {
    transform: translateY(-2px);
  }
  .liquid-btn:active {
    transform: translateY(0);
  }

  /* 6. Mobile Drawer Slide & Fade */
  #mobile-menu {
    transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease, transform 0.35s ease;
  }
  #mobile-menu.menu-closed {
    max-height: 0;
    opacity: 0;
    transform: translateY(-8px);
    overflow: hidden;
    padding-top: 0;
    padding-bottom: 0;
  }
  #mobile-menu.menu-open {
    max-height: 560px;
    opacity: 1;
    transform: translateY(0);
  }
</style>

<!-- JAVASCRIPT: ACTIVE PAGE HIGHLIGHT & THEME TOGGLE -->
<script>
  (function() {
    // 1. Reading Scroll Progress Indicator
    const progressBar = document.getElementById('scrollProgressBar');
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      if (progressBar) progressBar.style.width = scrolled + '%';
    });

    // 2. Active Page Name Highlight Logic
    const currentPath = window.location.pathname.split('/').pop().toLowerCase();
    const navLinks = document.querySelectorAll('.nav-link-item, .mobile-nav-link');

    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      // Agar currentPath match kare ya root/empty ho toh index.html active hoga
      if (href === currentPath || ((currentPath === '' || currentPath === 'index.html') && href === 'index.html')) {
        link.classList.add('active');
        if (link.classList.contains('mobile-nav-link')) {
          link.classList.add('bg-[#fce5e9]', 'dark:bg-[#1c1635]', 'text-[#8B639B]', 'dark:text-[#ff9ebb]');
        }
      } else {
        link.classList.remove('active');
      }
    });

    // 3. Mobile Menu Smooth Toggle
    const navToggle = document.getElementById('nav-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    if (navToggle && mobileMenu) {
      navToggle.addEventListener('click', () => {
        const isOpen = mobileMenu.classList.contains('menu-open');
        if (isOpen) {
          mobileMenu.classList.remove('menu-open');
          mobileMenu.classList.add('menu-closed');
        } else {
          mobileMenu.classList.remove('menu-closed');
          mobileMenu.classList.add('menu-open');
        }
      });
    }

    // 4. Dual-Icon Theme Toggle with LocalStorage (Desktop & Mobile)
    if (document.documentElement.classList.contains('dark') || localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    const handleThemeToggle = () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };

    const themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', handleThemeToggle);
    }

    const mobileThemeBtn = document.getElementById('mobile-theme-toggle');
    if (mobileThemeBtn) {
      mobileThemeBtn.addEventListener('click', handleThemeToggle);
    }
  })();
</script>
